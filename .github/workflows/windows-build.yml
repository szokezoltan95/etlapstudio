name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name EtlapStudio --add-data "fonts;fonts" --add-data "themes_builtin;themes_builtin" etlapstudio.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: EtlapStudio-Windows
          path: dist/EtlapStudio/
