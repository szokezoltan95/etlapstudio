name: Windows installer and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Create Windows icon from restaurant emblem
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('design_assets/megyehaza_emblem.png').convert('RGBA').save('design_assets/megyehaza_emblem.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name EtlapStudio --icon design_assets/megyehaza_emblem.ico --add-data "themes_builtin;themes_builtin" --add-data "design_assets;design_assets" --add-data "data;data" --add-data "LICENSE;." qt_app.pyw
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.2 installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EtlapStudio-Windows-1.0.2
          path: dist/installer/EtlapStudio-Setup-1.0.2.exe
          if-no-files-found: error

  restore-v1-0-1:
    needs: build
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release EtlapStudio 1.0.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EtlapStudio-Windows-1.0.1
          run-id: 39589289180
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: restore
      - name: Restore original 1.0.1 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.1 restore/EtlapStudio-Setup-1.0.1.exe --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release EtlapStudio 1.0.2]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EtlapStudio-Windows-1.0.2
          path: dist/installer
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}
          target_commitish: ${{ github.sha }}
          name: ÉtlapStúdió 1.0.2 · különleges étlapméretezés
          body: |
            Az 1.0.2-es frissítés a Különleges lap szerkesztőjébe helyezi át a képméret beállítását. A kiválasztott vászonméret azonnal megjelenik az előnézetben és PNG-exportnál is. Lábjegyzet nélkül a fő tartalompanel kitölti a felszabaduló helyet.

            A Windows telepítő önállóan tartalmazza az alkalmazást és függőségeit. Töltsd le az `EtlapStudio-Setup-1.0.2.exe` fájlt, majd futtasd.
          files: dist/installer/EtlapStudio-Setup-1.0.2.exe
          draft: false
          prerelease: false
