name: Windows installer and release

on:
  push:
    branches: [main, feature/daily-section-columns]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path version.py -Pattern '^APP_VERSION = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $version) { throw "Could not read version.py" }
          if ("${{ github.ref }}".StartsWith("refs/tags/")) { $version = "${{ github.ref_name }}".TrimStart("v") }
          "version=$version" >> $env:GITHUB_OUTPUT
          Set-Content -Path version.py -Value ('APP_VERSION = "' + $version + '"') -Encoding ascii
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Create Windows icon from restaurant emblem
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('design_assets/megyehaza_emblem.png').convert('RGBA').save('design_assets/megyehaza_emblem.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build Windows updater
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EtlapStudioUpdater updater.py
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name EtlapStudio --icon design_assets/megyehaza_emblem.ico --add-binary "dist/EtlapStudioUpdater.exe;." --add-data "themes_builtin;themes_builtin" --add-data "design_assets;design_assets" --add-data "data;data" --add-data "LICENSE;." qt_app.pyw
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: EtlapStudio-Windows-${{ steps.version.outputs.version }}
          path: dist/installer/EtlapStudio-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  restore-v1-0-1:
    needs: build
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release EtlapStudio 1.0.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EtlapStudio-Windows-1.0.1
          run-id: 39589289180
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: restore
      - name: Restore original 1.0.1 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.1 restore/EtlapStudio-Setup-1.0.1.exe --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release EtlapStudio 1.0.2]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.1.0]')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EtlapStudio-Windows-${{ needs.build.outputs.version }}
          path: dist/installer
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ÉtlapStúdió ${{ needs.build.outputs.version }}
          body: |
            Az ÉtlapStúdió ${{ needs.build.outputs.version }} Windows-kiadása. A telepítő tartalmazza az alkalmazást és annak függőségeit.

            A programban a **Program → Frissítések keresése…** menüponttal ellenőrizheted és telepítheted az új verziókat. A helyi ételadatbázis és éttermi adatok a Dokumentumok mappában maradnak; a telepítő csak a programfájlokat cseréli.
          files: dist/installer/EtlapStudio-Setup-${{ needs.build.outputs.version }}.exe
          draft: false
          prerelease: false
