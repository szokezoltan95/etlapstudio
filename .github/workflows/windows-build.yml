name: Windows portable build and release

on:
  push:
    branches: [main, feature/daily-section-columns, feature/installerless-updater, release/1.1.1-installer-asset, feature/special-canvas-reflow, feature/special-header-layouts, fix/logo-header-spacing]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path version.py -Pattern '^APP_VERSION = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $version) { throw "Could not read version.py" }
          if ("${{ github.ref }}".StartsWith("refs/tags/")) { $version = "${{ github.ref_name }}".TrimStart("v") }
          "version=$version" >> $env:GITHUB_OUTPUT
          Set-Content -Path version.py -Value ('APP_VERSION = "' + $version + '"') -Encoding ascii
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ordering regression tests
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Create Windows icon from restaurant emblem
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('design_assets/megyehaza_emblem.png').convert('RGBA').save('design_assets/megyehaza_emblem.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build Windows updater
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EtlapStudioUpdater updater.py
      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name EtlapStudio --icon design_assets/megyehaza_emblem.ico --add-binary "dist/EtlapStudioUpdater.exe;." --add-data "themes_builtin;themes_builtin" --add-data "design_assets;design_assets" --add-data "data;data" --add-data "LICENSE;." qt_app.pyw
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer.iss
      - name: Package portable Windows update and collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Compress-Archive -Path 'dist/EtlapStudio/*' -DestinationPath "dist/release/EtlapStudio-Windows-${{ steps.version.outputs.version }}.zip" -CompressionLevel Optimal
          Copy-Item "dist/installer/EtlapStudio-Setup-${{ steps.version.outputs.version }}.exe" -Destination dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: EtlapStudio-Windows-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error

  restore-v1-0-1:
    needs: build
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release EtlapStudio 1.0.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EtlapStudio-Windows-1.0.1
          run-id: 39589289180
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: restore
      - name: Restore original 1.0.1 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.1 restore/EtlapStudio-Setup-1.0.1.exe --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release EtlapStudio 1.0.2]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.1.0]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.1.1]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.2.0]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.2.1]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.2.2]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.3.0]') || contains(github.event.head_commit.message, '[release EtlapStudio 1.3.1]')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EtlapStudio-Windows-${{ needs.build.outputs.version }}
          path: dist/release
      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$RELEASE_VERSION" == "1.3.1" ]]; then
            cat > release-notes.md <<'EOF'
          ÉtlapStúdió 1.3.1
          • Hozzáadva a Ctrl+görgetéses nagyítás az előnézet Kézi módjához; a normál görgetés továbbra is függőleges görgetést végez.

          ÉtlapStúdió 1.3.0
          • Javítva a hosszú napi ételszövegek megjelenítése: csak az érintett sor betűmérete csökken.
          • Javítva a heti menü hosszú fogásainak tördelése és lapon belüli elhelyezése; szükség esetén a betűméret és a függőleges térköz igazodik.
          • Hozzáadva az előnézet Kézi módja, pásztázással és plusz/mínusz gombos nagyítással.
          EOF
          elif [[ "$RELEASE_VERSION" == "1.3.0" ]]; then
            cat > release-notes.md <<'EOF'
          ## Újdonságok
          - Az előnézetben megjelent a **Kézi** mód, amelyben szabadon pásztázható és nagyítható az étlap; a + és − gombok kizárólag ebben a módban láthatók.
          - A heti menü hosszú ételszövegei soronként tördelődnek, és csak az érintett napblokk igazodik a szükséges magassághoz.

          ## Javítások
          - A napi étlapon hosszú szövegnél csak az érintett sor betűmérete csökken.
          - A heti menü végső illesztése szükség esetén a betűméretet és a függőleges térközöket csökkenti; a blokkok szélességét és arányait nem torzítja, a fejlécet és az árat nem méretezi át.

          ## Telepítés és frissítés
          - A Windows telepítő EtlapStudio-Setup-1.3.0.exe új telepítéshez használható.
          - Az alkalmazáson belüli frissítéshez a hordozható EtlapStudio-Windows-1.3.0.zip készül el.
          EOF
          elif [[ "$RELEASE_VERSION" == "1.2.2" ]]; then
            cat > release-notes.md <<'EOF'
          - Az egyes napi étlapok saját sorrendje külön, dátumhoz kötötten mentődik.
          - Az új ételek a napi sorrend alapján, a következő meglévő étel elé kerülnek a globális sorrendben.
          - A nem aznapi ételek is megőrzik egymáshoz viszonyított sorrendjüket; a beszúrás utánuk is helyesen tolja a prioritásokat.
          - A globális sorrend a következő napi étlap kiindulópontjaként szolgál.
          EOF
          else
            printf '%s\n' "Az ÉtlapStúdió ${{ needs.build.outputs.version }} Windows-kiadása. A frissítőcsomag ZIP-ben tartalmazza az alkalmazást; az alkalmazás a Program → Frissítések keresése… menüpontból, telepítőprogram nélkül frissíthető." > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ÉtlapStúdió ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/release/EtlapStudio-Setup-${{ needs.build.outputs.version }}.exe
            dist/release/EtlapStudio-Windows-${{ needs.build.outputs.version }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
